<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>DKWIN</title>
    
    <!-- Firebase SDK Integration -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* =========================================================================
           CSS RESET AND BASE STYLES
           ========================================================================= */
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================================================
           GAME BACKGROUND IFRAME CONTAINER
           ========================================================================= */
        .iframe-container {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }

        /* =========================================================================
           VISUAL EFFECTS LAYER (Only Fireflies - Falling Balls Removed)
           ========================================================================= */
        .effects-layer {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .firefly {
            position: absolute;
            width: 5px; 
            height: 5px;
            background: #fffb00;
            border-radius: 50%;
            box-shadow: 0 0 10px #fffb00, 0 0 20px #fffb00;
            opacity: 0;
            animation: flyAround 6s infinite ease-in-out;
        }

        @keyframes flyAround {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            50% { transform: translate(40px, -50px) scale(1.5); opacity: 0.8; }
            80% { opacity: 1; }
            100% { transform: translate(80px, -100px) scale(0.8); opacity: 0; }
        }

        /* =========================================================================
           PREMIUM SIGNAL PANEL (MADE SLIGHTLY SMALLER & CIRCULAR/ROUNDED)
           ========================================================================= */
        .box { 
            width: 175px; /* Slightly smaller width */
            height: auto;
            background: rgba(5, 5, 5, 0.95); 
            border-radius: 70px; /* Slightly adjusted for smaller size */
            color: #ffffff; 
            text-align: center; 
            padding: 12px 8px; /* Slightly reduced padding */
            position: fixed; 
            top: 40px; /* Adjusted top to fit butterfly */
            right: 10px;
            z-index: 9999; 
            cursor: grab; 
            backdrop-filter: blur(20px); 
            box-sizing: border-box;
            touch-action: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px; /* Tighter gap */
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            border: 2px solid #00ff66;
        }

        .box::before {
            content: "";
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, #ff0055, #00ff66, #0099ff, #ff0055);
            background-size: 400%;
            z-index: -1;
            border-radius: 72px; 
            animation: rgbBorder 4s linear infinite;
            opacity: 0.6; 
        }

        @keyframes rgbBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .box:active { cursor: grabbing; }

        /* =========================================================================
           RED BUTTERFLY COVER (প্রজাপতির ঢাকনা)
           ========================================================================= */
        .butterfly-cover {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            z-index: 10001;
            pointer-events: none;
            filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.8));
            animation: flutter 2s infinite ease-in-out;
        }

        @keyframes flutter {
            0% { transform: translateX(-50%) translateY(0) rotate(-5deg); }
            50% { transform: translateX(-50%) translateY(-8px) rotate(5deg); }
            100% { transform: translateX(-50%) translateY(0) rotate(-5deg); }
        }

        .wing-l, .wing-r { transform-origin: 50px 50px; }
        .wing-l { animation: flapL 0.3s infinite alternate ease-in-out; }
        .wing-r { animation: flapR 0.3s infinite alternate ease-in-out; }

        @keyframes flapL { from { transform: rotateY(0deg); } to { transform: rotateY(60deg); } }
        @keyframes flapR { from { transform: rotateY(0deg); } to { transform: rotateY(-60deg); } }

        /* Header & Logo */
        .panel-header {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 5px; 
            width: 100%;
            margin-top: 15px; /* Added margin to accommodate butterfly */
        }

        .premium-logo-area {
            position: relative; 
            width: 50px; /* Smaller size */
            height: 50px; /* Smaller size */
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        .logo-image {
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2); 
            z-index: 2;
        }

        .logo-ring {
            position: absolute; 
            width: 120%; 
            height: 120%;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50%; 
            animation: spinRing 4s infinite linear; 
            z-index: 1;
        }

        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        .server-badge {
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 4px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 3px 8px; 
            font-size: 8px; 
            font-weight: 800; 
            color: #fff;
            text-transform: uppercase;
            width: 100%; 
            letter-spacing: 0.5px;
        }
        
        .vpn-dot {
            width: 6px; 
            height: 6px; 
            background-color: #00ff66;
            border-radius: 50%; 
            box-shadow: 0 0 6px #00ff66;
            animation: blink 1.5s infinite;
        }

        /* Login Section */
        .login-part { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            width: 100%; 
        }
        
        .login-part input { 
            width: 100%; 
            padding: 6px; 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid #00ff66; 
            border-radius: 20px; 
            color: #fff; 
            font-size: 9px; 
            text-align: center; 
            outline: none; 
            box-sizing: border-box;
        }
        
        .login-btn { 
            width: 100%; 
            padding: 6px; 
            background: #00ff66; 
            color: #000; 
            border: none; 
            border-radius: 20px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 9px; 
            text-transform: uppercase; 
            box-shadow: 0 4px 10px rgba(0, 255, 102, 0.3);
            transition: transform 0.2s;
        }
        
        .login-btn:hover { 
            background: #00cc55; 
            transform: scale(1.02);
        }

        /* Signal Application Section */
        .app-part { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 6px; 
            width: 100%; 
        }
        
        .period-top-box {
            background: transparent;
            border-radius: 20px; 
            padding: 0; 
            width: 100%; 
            text-align: center; 
            box-sizing: border-box;
        }

        .period-label { 
            font-size: 8px; 
            color: #888; 
            display: block; 
            font-weight: 600; 
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        #periodID { 
            font-size: 12px; 
            font-weight: 800; 
            display: block; 
            color: #fff; 
            letter-spacing: 0.5px;
        }

        .timer-container { 
            text-align: center; 
            width: 100%; 
        }
        
        .timer-txt { 
            font-size: 11px; 
            color: #ffaa00; 
            font-weight: 800; 
            background: rgba(255, 170, 0, 0.15); 
            padding: 4px; 
            border-radius: 20px;
            display: block;
        }

        /* Signal Output Area */
        #signalContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
            padding: 10px; 
            box-sizing: border-box;
            border: 1px solid #00ff66; 
            background: rgba(0, 255, 102, 0.08); 
            border-radius: 30px; 
        }

        .signal-label { 
            font-size: 8px; 
            color: #00ff66; 
            text-transform: uppercase; 
            font-weight: bold; 
            letter-spacing: 1px;
        }

        .output-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%; 
        }
        
        /* MASSIVE TEXT, THICK AND TAN-TAN (GLOWING) - Made slightly smaller for panel */
        .size-txt { 
            font-size: 36px; 
            font-weight: 950; 
            text-transform: uppercase; 
            line-height: 1; 
            text-shadow: 0 0 15px currentColor, 0 0 30px currentColor;
            letter-spacing: -2px;
            animation: glowPulse 1s infinite alternate;
        }

        @keyframes glowPulse {
            from { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor; }
            to { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
        }

        /* Colors */
        .res-big { color: #FFFF00; }  
        .res-small { color: #ff3366; } 
        
        .processing { 
            font-size: 11px; 
            color: #ffaa00; 
            animation: blink 0.5s infinite; 
            display: block; 
            font-weight: 900; 
            letter-spacing: 1px;
            padding: 12px 0;
        }
        
        @keyframes blink { 50% { opacity: 0.3; } }
        
        .hidden { display: none !important; }

        /* =========================================================================
           RESULT CHAT PANEL (LIVE RESULT GHOST) - INCREASED SIZE
           ========================================================================= */
        .chat-panel {
            width: 190px; /* Increased width from 150px */
            max-height: 420px; /* Increased max-height from 350px */
            background: rgba(5, 5, 5, 0.95);
            border-radius: 35px; 
            color: #fff;
            padding: 12px; /* Increased padding from 8px */
            position: fixed;
            top: 520px; 
            right: 10px; 
            z-index: 9998;
            cursor: grab;
            backdrop-filter: blur(20px);
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            gap: 8px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            border: 2px solid #00ff66;
            touch-action: none;
        }

        .chat-panel::before {
            content: "";
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            background: linear-gradient(45deg, #ff0055, #00ff66, #0099ff, #ff0055);

            z-index: -1;
            border-radius: 38px;
            animation: rgbBorder 4s linear infinite;

        }
        
        .chat-panel:active { cursor: grabbing; }

        .chat-header {
            font-size: 11px; /* Increased font size from 9px */
            font-weight: 800;
            text-align: center;
            color: #00ff66;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 8px; 
            border-bottom: 1px solid rgba(0,255,102,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .chat-header .live-dot {
            width: 7px; /* Increased dot size */
            height: 7px; 
            background: #ff0044;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0044;
            animation: blink 1s infinite;
        }

        .chat-body {
            max-height: 360px; /* Increased max-height from 290px */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px; /* Increased gap from 4px */
            padding-right: 3px;
        }
        
        .chat-body::-webkit-scrollbar { width: 4px; }
        .chat-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
        .chat-body::-webkit-scrollbar-thumb { background: #00ff66; border-radius: 4px; }

        .chat-msg {
            font-size: 9px; /* Increased font size from 7px */
            font-weight: 800;
            padding: 6px 8px; /* Increased padding from 4px 5px */
            border-radius: 12px;
            text-align: center;
            letter-spacing: 0.5px;
            animation: msgIn 0.4s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            flex-direction: column;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .chat-msg.win {
            background: rgba(0, 255, 102, 0.15);
            color: #00ff66;
            border: 1px solid #00ff66;
        }
        
        .chat-msg.loss {
            background: rgba(255, 0, 68, 0.15);
            color: #ff0044;
            border: 1px solid #ff0044;
        }

        .chat-msg .msg-label {
            font-size: 11px; /* Increased font size from 8px */
            font-weight: 900;
        }
        
        .chat-msg .msg-period {
            font-size: 8px; /* Increased font size from 6px */
            opacity: 0.8;
            font-weight: 600;
        }

        .chat-empty {
            font-size: 10px; /* Increased font size from 8px */
            color: #888;
            text-align: center;
            padding: 20px 4px; 
            font-style: italic;
        }
    </style>
</head>

    <script>
        /* =========================================================================
           FIREBASE CONFIGURATION & INITIALIZATION
           ========================================================================= */
        const firebaseConfig = {
            apiKey: "AIzaSyBPBQOeApFZQwGX8G4mZxhY5C2jjN6VWmU",
            authDomain: "dkwin-panel-ai.firebaseapp.com",
            databaseURL: "https://dkwin-panel-ai-default-rtdb.firebaseio.com",
            projectId: "dkwin-panel-ai",
            storageBucket: "dkwin-panel-ai.firebasestorage.app",
            messagingSenderId: "925573387640",
            appId: "1:925573387640:web:8faf648b0b89933c89e48d",
            measurementId: "G-X3ZFCRWEH8"
        };

        firebase.initializeApp(firebaseConfig);
        
        /* =========================================================================
           GLOBAL VARIABLES AND STATE MANAGEMENT
           ========================================================================= */
        let lastP = null;
        let _active = false;
        let currentSignal = null;
        let evaluatedPeriods = new Set();

        /* =========================================================================
           VISUAL EFFECTS GENERATOR
           ========================================================================= */
        function createVisualEffects() {
            const layer = document.getElementById('effectsLayer');
            
            // Create Fireflies (Jonaki Poka)
            for(let i=0; i<50; i++) {
                let f = document.createElement('div');
                f.className = 'firefly';
                f.style.left = Math.random() * 100 + 'vw';
                f.style.top = Math.random() * 100 + 'vh';
                f.style.animationDelay = Math.random() * 5 + 's';
                f.style.animationDuration = (Math.random() * 4 + 4) + 's';
                layer.appendChild(f);
            }
        }
        createVisualEffects();

        /* =========================================================================
           DRAG LOGIC FOR PANELS
           ========================================================================= */
        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY;
            let currentX = 0, currentY = 0;

            function dragStart(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || 
                    e.target.classList.contains('vpn-dot') || e.target.closest('.chat-body')) return;
                
                isDragging = true;
                element.style.cursor = 'grabbing';
                
                const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
                
                startX = clientX - currentX;
                startY = clientY - currentY;
                
                if (e.type === "touchstart") e.preventDefault();
            }

            function dragEnd() {
                if (isDragging) {
                    isDragging = false;
                    element.style.cursor = 'grab';
                }
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();
                
                const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                
                currentX = clientX - startX;
                currentY = clientY - startY;
                
                element.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }

            element.style.cursor = 'grab';
            element.addEventListener("mousedown", dragStart);
            element.addEventListener("touchstart", dragStart, { passive: false });

            window.addEventListener("mouseup", dragEnd);
            window.addEventListener("touchend", dragEnd);
            
            window.addEventListener("mousemove", drag);
            window.addEventListener("touchmove", drag, { passive: false });
        }

        makeDraggable(document.getElementById("dragBox"));
        makeDraggable(document.getElementById("chatPanel"));

        /* =========================================================================
           INTERNET CONNECTIVITY LOGIC
           ========================================================================= */
        function updateConnectionStatus() {
            const statusText = document.getElementById('serverStatusText');
            const dot = document.getElementById('serverDot');
            const dragBox = document.getElementById('dragBox');
            const chatPanel = document.getElementById('chatPanel');
            
            if (navigator.onLine) {
                statusText.style.color = "#ffffff";
                dot.style.backgroundColor = "#00ff66";
                dot.style.boxShadow = "0 0 8px #00ff66";
                
                if(_active) {
                    dragBox.style.display = 'flex';
                    chatPanel.style.display = 'flex';
                }
            } else {
                statusText.innerText = "SERVER OFFLINE";
                statusText.style.color = "#ff3333";
                dot.style.backgroundColor = "#ff0000";
                dot.style.boxShadow = "0 0 8px #ff0000";
                
                dragBox.style.display = 'none';
                chatPanel.style.display = 'none';
            }
        }

        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        /* =========================================================================
           ADD CHAT MESSAGE FUNCTION
           ========================================================================= */
        function addChatMessage(result, period, predictedSize, actualSize) {
            const chatBody = document.getElementById('chatBody');
            
            const empty = chatBody.querySelector('.chat-empty');
            if (empty) empty.remove();
            
            const msg = document.createElement('div');
            msg.className = 'chat-msg ' + (result === 'WIN' ? 'win' : 'loss');
            
            const shortPeriod = period ? period.toString().slice(-5) : '-----';
            msg.innerHTML = `
                <span class="msg-label">${result === 'WIN' ? '✅ WIN' : '❌ LOSS'}</span>
                <span class="msg-period">#${shortPeriod} | ${predictedSize}→${actualSize}</span>
            `;
            
            chatBody.insertBefore(msg, chatBody.firstChild);
            
            while (chatBody.children.length > 30) {
                chatBody.removeChild(chatBody.lastChild);
            }
        }

        /* =========================================================================
           LOGIN AUTHENTICATION
           ========================================================================= */
        function checkPass() {
            if (document.getElementById('passInput').value.trim() === "VIP100") {
                document.getElementById('loginPart').classList.add('hidden'); 
                document.getElementById('appPart').classList.remove('hidden'); 
                _active = true;
                
                updateConnectionStatus();
                fetchData();
                setInterval(loop, 1000);
                setInterval(fetchData, 5000);
            } else { 
                alert("❌ Wrong Password!"); 
            }
        }

        /* =========================================================================
           DATA FETCHING & RESULT CHECKING
           ========================================================================= */
        async function fetchData() {
            if (!navigator.onLine) return;

            try {
                const res = await fetch("https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?r=" + Date.now());
                const json = await res.json();
                
                if (json.data?.list.length > 0) {
                    const latestIssue = json.data.list[0].issueNumber;
                    const newLastP = (BigInt(latestIssue) + 1n).toString();
                    
                    if (currentSignal && String(currentSignal.period) === String(latestIssue)) {
                        const actualNum = parseInt(json.data.list[0].number);
                        const actualSize = (actualNum >= 5) ? "BIG" : "SMALL";
                        const resultStr = (actualSize === currentSignal.size) ? "WIN" : "LOSS";
                        
                        if (!evaluatedPeriods.has(String(latestIssue))) {
                            evaluatedPeriods.add(String(latestIssue));
                            addChatMessage(resultStr, latestIssue, currentSignal.size, actualSize);
                            
                            if (evaluatedPeriods.size > 50) {
                                const arr = Array.from(evaluatedPeriods);
                                evaluatedPeriods = new Set(arr.slice(-25));
                            }
                        }
                    }
                    
                    lastP = newLastP;
                }
            } catch (e) { 
                const now = new Date();
                const totalSeconds = Math.floor(now.getTime() / 1000);
                lastP = Math.floor(totalSeconds / 30).toString(); 
            }
        }

        /* =========================================================================
           SIGNAL ALGORITHM
           ========================================================================= */
        function analyzeQuantumSignal(period) {
            let hash1 = 0; 
            const seed1 = period + "DKWIN_INDIA_SERVER_SECURE_2026_30S_NUM_A";
            
            for (let i = 0; i < seed1.length; i++) {
                hash1 = ((hash1 << 5) - hash1) + seed1.charCodeAt(i);
                hash1 |= 0;
            }
            
            let targetNumber = Math.abs(hash1) % 10;
            let sizeResult = (targetNumber >= 5) ? "BIG" : "SMALL";
            
            return { size: sizeResult };
        }

        /* =========================================================================
           MAIN TIMER & UI LOOP
           ========================================================================= */
        function loop() {
            if (!_active) return;
            
            if (!navigator.onLine) {
                document.getElementById('timer').innerText = "--";
                return;
            }

            const now = new Date();
            const sec = now.getSeconds();
            
            const pBox = document.getElementById('periodID');
            if(lastP) {
                pBox.innerText = lastP;
            } else {
                pBox.innerText = "Sync...";
            }
            
            let rem = 30 - (sec % 30);
            if (rem === 30) rem = 0; 
            
            document.getElementById('timer').innerText = rem < 10 ? "0" + rem : rem;

            const outputWrapper = document.getElementById('predictionOutput');

            if (rem <= 6 || rem === 0) {
                outputWrapper.innerHTML = '<span class="processing">SCANNING MARKET...</span>';
            } else {
                if (!currentSignal || String(currentSignal.period) !== String(lastP)) {
                    const result = analyzeQuantumSignal(lastP || "0");
                    currentSignal = { period: lastP, size: result.size };
                }
                
                if (currentSignal) {
                    outputWrapper.innerHTML = `
                        <div class="output-row">
                            <span class="size-txt res-${currentSignal.size.toLowerCase()}">${currentSignal.size}</span>
                        </div>
                    `;
                }
            }
        }
    </script>
