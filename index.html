    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyBPBQOeApFZQwGX8G4mZxhY5C2jjN6VWmU",

            appId: "1:925573387640:web:8faf648b0b89933c89e48d",

        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ===== STATE =====
        let isLoggedIn = false;
        let isOnline = navigator.onLine;
        let predictionInterval = null;
        let clockInterval = null;
        let periodCounter = 0;
        let currentSignalData = { number: null, color: null, signal: null };

        // ===== DOM REFS =====
        const signalPanel = document.getElementById('signalPanel');
        const panelHeader = document.getElementById('panelHeader');
        const passUI = document.getElementById('passUI');
        const mainUI = document.getElementById('mainUI');
        const offlineMsg = document.getElementById('offlineMsg');
        const passInput = document.getElementById('passInput');
        const timerDiv = document.getElementById('timer');
        const sigRes = document.getElementById('signalResult');
        const clockTime = document.getElementById('clockTime');
        const periodNum = document.getElementById('periodNum');
        const periodBadge = document.getElementById('periodBadge');
        const numberDisplay = document.getElementById('numberDisplay');
        const colorDisplay = document.getElementById('colorDisplay');
        const numberColorRow = document.getElementById('numberColorRow');

        // ===== CLOCK =====
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            clockTime.textContent = h + ':' + m + ':' + s;
        }

        function startClock() {
            if (clockInterval) clearInterval(clockInterval);
            updateClock();
            clockInterval = setInterval(updateClock, 1000);
        }

        // ===== UI STATE HELPERS =====
        function showOfflineUI() {
            signalPanel.classList.add('offline');
            panelHeader.classList.add('offline');
            panelHeader.innerHTML = '<span>⚡ OFFLINE</span><span class="badge">#--</span>';
            offlineMsg.style.display = 'block';
            passUI.style.display = 'none';
            mainUI.style.display = 'none';
            if (predictionInterval) { clearInterval(predictionInterval);
                predictionInterval = null; }
        }

        function showLoginUI() {
            signalPanel.classList.remove('offline');
            panelHeader.classList.remove('offline');
            panelHeader.innerHTML = '<span>⚡ 30S AI</span><span class="badge">#<span id="periodNum">0</span></span>';
            offlineMsg.style.display = 'none';
            passUI.style.display = 'block';
            mainUI.style.display = 'none';
            if (predictionInterval) { clearInterval(predictionInterval);
                predictionInterval = null; }
            if (periodNum) periodNum.textContent = periodCounter;
            // reset number/color display
            numberDisplay.textContent = '--';
            numberDisplay.className = '--';
            colorDisplay.textContent = '--';
            colorDisplay.className = '--';
            numberColorRow.className = '--';
            sigRes.textContent = '--';
            sigRes.className = '--';
        }

        function showSignalUI() {
            signalPanel.classList.remove('offline');
            panelHeader.classList.remove('offline');
            panelHeader.innerHTML = '<span>⚡ 30S AI</span><span class="badge">#<span id="periodNum">' + periodCounter +
                '</span></span>';
            offlineMsg.style.display = 'none';
            passUI.style.display = 'none';
            mainUI.style.display = 'block';
            if (!clockInterval) startClock();
            if (periodNum) periodNum.textContent = periodCounter;
            if (!predictionInterval) startPrediction();
        }

        function showConnLostUI() {
            signalPanel.classList.add('offline');
            panelHeader.classList.add('offline');
            panelHeader.innerHTML = '<span>⚡ LOST</span>';
            offlineMsg.style.display = 'none';
            passUI.style.display = 'none';
            mainUI.style.display = 'block';
            sigRes.textContent = '--';
            sigRes.className = '--';
            timerDiv.textContent = '--:--';
            numberDisplay.textContent = '--';
            numberDisplay.className = '--';
            colorDisplay.textContent = '--';
            colorDisplay.className = '--';
            numberColorRow.className = '--';
            if (predictionInterval) { clearInterval(predictionInterval);
                predictionInterval = null; }
        }

        // ===== CONNECTIVITY =====
        function updateConnectivity() {
            isOnline = navigator.onLine;
            if (!isOnline) {
                if (isLoggedIn) showConnLostUI();
                else showOfflineUI();
                return;
            }
            if (isLoggedIn) showSignalUI();
            else showLoginUI();
        }

        // ===== LOGIN =====
        function activatePanel() {
            if (!navigator.onLine) { alert('⚠️ No internet connection.'); return; }
            if (passInput.value === "VIPAI9S") {
                isLoggedIn = true;
                periodCounter = 0;
                showSignalUI();
                passInput.value = '';
            } else {
                alert("❌ Wrong Key!");
                passInput.value = '';
                passInput.focus();
            }
        }

        // ===== PREDICTION ENGINE =====
        function startPrediction() {
            if (predictionInterval) { clearInterval(predictionInterval);
                predictionInterval = null; }

            sigRes.textContent = '--';
            sigRes.className = '--';
            timerDiv.textContent = '00:30';
            numberDisplay.textContent = '--';
            numberDisplay.className = '--';
            colorDisplay.textContent = '--';
            colorDisplay.className = '--';
            numberColorRow.className = '--';
            currentSignalData = { number: null, color: null, signal: null };

            predictionInterval = setInterval(() => {
                if (!navigator.onLine) { showConnLostUI(); return; }
                if (!isLoggedIn) { showLoginUI(); return; }

                const now = new Date();
                const seconds = now.getSeconds();
                const remaining = 30 - (seconds % 30);

                timerDiv.textContent = "00:" + (remaining < 10 ? "0" : "") + remaining;

                // Period increment at cycle start
                if (remaining === 30) {
                    periodCounter++;
                    const pNum = document.getElementById('periodNum');
                    if (pNum) pNum.textContent = periodCounter;
                    const badge = document.querySelector('#signalPanel .badge');
                    if (badge) badge.innerHTML = '#' + periodCounter;
                }

                // Trigger prediction at cycle start (30) and end (1)
                if (remaining === 30 || remaining === 1) {
                    if (window._predictionTimeout) {
                        clearTimeout(window._predictionTimeout);
                        window._predictionTimeout = null;
                    }

                    const isCycleStart = (remaining === 30);
                    const notingDuration = isCycleStart ? 5000 : 1200;

                    // Show NOTING
                    sigRes.textContent = 'NOTING';
                    sigRes.className = 'NOTING';
                    // Hide number & color during NOTING
                    numberDisplay.textContent = '--';
                    numberDisplay.className = '--';
                    colorDisplay.textContent = '--';
                    colorDisplay.className = '--';
                    numberColorRow.className = '--';

                    window._predictionTimeout = setTimeout(() => {
                        // === Generate signal ===
                        const rand = Math.random();
                        let signal = rand > 0.5 ? "BIG" : "SMALL";

                        const gameRand = Math.random();
                        const gameResult = gameRand > 0.5 ? "BIG" : "SMALL";
                        const isWin = (signal === gameResult);
                        const outcome = isWin ? "WIN" : "LOSS";

                        // Generate number 0-9
                        let num = Math.floor(Math.random() * 10);

                        // Determine color based on number
                        let color;
                        if (num === 0 || num === 5) {
                            color = "VALLEY";
                        } else if (num === 2 || num === 4 || num === 6 || num === 8) {
                            color = "RED";
                        } else {
                            color = "GREEN";
                        }

                        // Store current signal data
                        currentSignalData = { number: num, color: color, signal: signal };

                        // === Update UI ===
                        // Main signal
                        sigRes.textContent = signal;
                        sigRes.className = signal;

                        // Number
                        numberDisplay.textContent = num;
                        numberDisplay.className = '';

                        // Color
                        colorDisplay.textContent = color;
                        colorDisplay.className = color;

                        // Row
                        numberColorRow.className = '';

                        // === Push to Firebase ===
                        try {
                            database.ref('signals_30s').set({
                                type: signal,
                                color: color,
                                number: num,
                                gameResult: gameResult,
                                outcome: outcome,
                                period: periodCounter,
                                timestamp: now.getTime()
                            });
                        } catch (e) { /* ignore */ }

                        window._predictionTimeout = null;
                    }, notingDuration);
                }
            }, 1000);
        }

        // ===== EVENTS =====
        window.addEventListener('online', () => {
            if (isLoggedIn) showSignalUI();
            else showLoginUI();
        });
        window.addEventListener('offline', () => {
            if (isLoggedIn) showConnLostUI();
            else showOfflineUI();
        });

        // ===== INIT =====
        if (navigator.onLine) {
            showLoginUI();
            startClock();
        } else {
            showOfflineUI();
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                updateConnectivity();
                if (isLoggedIn && !clockInterval) startClock();
            }
        });

        // ===== DRAGGABLE PANEL =====
        function makeDraggable(panel) {
            let offsetX = 0,
                offsetY = 0,
                isDragging = false;

            const startDrag = (clientX, clientY) => {
                const rect = panel.getBoundingClientRect();
                offsetX = clientX - rect.left;
                offsetY = clientY - rect.top;
                isDragging = true;
                panel.style.transition = 'none';
            };

            const moveDrag = (clientX, clientY) => {
                if (!isDragging) return;
                let left = clientX - offsetX;
                let top = clientY - offsetY;
                const w = panel.offsetWidth;
                const h = panel.offsetHeight;
                left = Math.max(0, Math.min(window.innerWidth - w, left));
                top = Math.max(0, Math.min(window.innerHeight - h, top));
                panel.style.left = left + 'px';
                panel.style.top = top + 'px';
            };

            const endDrag = () => {
                isDragging = false;
                panel.style.transition = '';
            };

            panel.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                startDrag(touch.clientX, touch.clientY);
            }, { passive: true });

            panel.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                moveDrag(touch.clientX, touch.clientY);
                e.preventDefault();
            }, { passive: false });

            panel.addEventListener('touchend', endDrag, { passive: true });
            panel.addEventListener('touchcancel', endDrag, { passive: true });

            panel.addEventListener('mousedown', (e) => {
                const target = e.target;
                if (target.tagName === 'INPUT' || target.tagName === 'BUTTON') return;
                startDrag(e.clientX, e.clientY);
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                moveDrag(e.clientX, e.clientY);
            });
            document.addEventListener('mouseup', endDrag);
        }

        makeDraggable(document.getElementById('signalPanel'));

        // ===== KEYBOARD SHORTCUT =====
        passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') activatePanel();
